name: 改善・機能提案
description: 利用上の課題と改善案を提案します
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。採用や実装時期は保証せず、学習効果、安全性、再利用性、保守負荷を踏まえて判断します。
  - type: checkboxes
    id: preliminary
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容のIssueがないことを確認しました
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 現在どの操作や学習場面で困るのかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する変更
      description: 期待する操作や結果を具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 現在の回避方法や、他に考えた方法があれば記載してください。
  - type: checkboxes
    id: scope
    attributes:
      label: 影響しそうな範囲
      options:
        - label: コードエディタまたはREPL
        - label: デバッグ実行
        - label: 仮想ボード、配線、デバイス
        - label: 保存形式または互換性
        - label: Device APIまたは外部デバイス
        - label: 文書、アクセシビリティ、多言語表示
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: モックアップ、関連資料、想定利用者があれば記載してください。
