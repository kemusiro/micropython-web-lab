name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        run: ./scripts/setup-node.sh
      - name: Install dependencies
        run: ./scripts/use-node.sh pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: ./scripts/use-node.sh pnpm exec playwright install --with-deps chromium
      - name: Run all checks
        run: ./scripts/use-node.sh pnpm check
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
