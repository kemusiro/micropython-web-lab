name: Browser compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native browsers
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's use-node.sh supports Linux/macOS. This disposable
      # Windows runner uses the same exact Node and packageManager versions.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Chrome and Edge full managed-build suite
        run: pnpm exec playwright test --config playwright.compatibility.config.ts --max-failures=4
      - name: Install pinned Firefox driver
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/browser-coverage | Out-Null
          Invoke-WebRequest https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-win64.zip -OutFile .cache/browser-coverage/geckodriver.zip
          $digest = (Get-FileHash .cache/browser-coverage/geckodriver.zip -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne 'dfed9315abe8d2fbc1b6161a2ee8002452e79cf05ee92fdc653a4e26bc35edd8') { throw 'Driver SHA-256 mismatch' }
          Expand-Archive .cache/browser-coverage/geckodriver.zip .cache/browser-coverage -Force
      - name: Firefox shared inputs, reset and failure recovery
        if: always()
        shell: pwsh
        run: |
          pnpm build:sakura
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $driver = Start-Process .cache/browser-coverage/geckodriver.exe -ArgumentList '--port','4444' -PassThru -RedirectStandardOutput .cache/browser-coverage/driver.log -RedirectStandardError .cache/browser-coverage/driver-error.log
          try {
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              try { Invoke-RestMethod http://127.0.0.1:4444/status | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
            }
            node scripts/verify-native-browser.mjs
            $result = $LASTEXITCODE
          } finally { Stop-Process -Id $driver.Id -ErrorAction SilentlyContinue }
          exit $result
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-browser-compatibility
          path: |
            test-results/
            .cache/browser-coverage/*.log
          retention-days: 14
